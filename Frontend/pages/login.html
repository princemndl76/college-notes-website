<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Notes | Login</title>

    <link rel="stylesheet" href="/Frontend/css/login.css">

</head>

<body>

    <div class="background">

        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>

        <div class="login-container" id="loginContainer">

            <!-- Left Section -->
            <div class="welcome-section">

                <div class="logo">
                    📚
                </div>

                <h1>College Notes</h1>

                <p>
                    Your Smart Learning Companion
                </p>

                <div class="features">

                    <div class="feature">
                        <span>📖</span>
                        <p>Subject-wise Notes</p>
                    </div>

                    <div class="feature">
                        <span>🎯</span>
                        <p>Unit-wise Learning</p>
                    </div>

                    <div class="feature">
                        <span>⚡</span>
                        <p>Quick Revision</p>
                    </div>

                </div>

            </div>


            <!-- Login Section -->
            <div class="login-section">

                <h2>Welcome Back!</h2>

                <p class="login-text">
                    Login to continue learning
                </p>


                <form id="loginForm">

                    <!-- Email -->
                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- Remember + Forgot -->
                    <div class="options">

                        <label>
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-btn"
                        id="submitBtn"
                    >
                        Login
                    </button>

                    <p class="status-msg" id="statusMsg"></p>


                    <p class="register-text">

                        Don't have an account?

<a href="/Frontend/pages/register.html">
    Create Account
</a>


                    </p>

                </form>

            </div>

        </div>

    </div>


    <!-- ===== ROCKET LAUNCH OVERLAY (hidden until login succeeds) ===== -->
    <div class="launch-overlay" id="launchOverlay">

        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>

        <div class="launch-stage">
            <div class="rocket" id="rocket">🚀</div>
            <div class="flame"></div>
            <div class="smoke"></div>
        </div>

        <div class="launch-caption">
            <div class="big" id="launchCaption">Launching your dashboard…</div>
            <div class="small">Get ready to learn 🚀</div>
        </div>

    </div>


<script src="/Frontend/js/login.js"></script>

</body>
</html>
