<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Quiz | College Notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: #1a1a2e;
            min-height: 100vh;

            background: linear-gradient(
                -45deg,
                #667eea,
                #764ba2,
                #f093fb,
                #4facfe
            );

            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #topbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #topbar h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
        }

        #backButton {
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        #backButton:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4338ca;
        }

        #content {
            max-width: 640px;
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            animation: slideUp 0.4s ease backwards;
        }

        /* =====================================================
           SEMESTER PICKER
        ===================================================== */

        h2.page-title {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            margin: 6px 0 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
        }

        .semester-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .semester-option {
            padding: 14px 10px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .semester-option:hover {
            border-color: #a5b4fc;
            background: #eef2ff;
        }

        .semester-option.selected {
            border-color: #6366f1;
            background: #6366f1;
            color: #fff;
        }

        #startQuizBtn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        #startQuizBtn:hover:not(:disabled) {
            background: #4338ca;
        }

        #startQuizBtn:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }

        /* =====================================================
           QUIZ IN PROGRESS
        ===================================================== */

        .quiz-progress-label {
            font-size: 13px;
            font-weight: 700;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .quiz-question-text {
            font-size: 17px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
            color: #374151;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quiz-option:hover {
            border-color: #a5b4fc;
            background: #eef2ff;
        }

        .quiz-option.selected {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4338ca;
        }

        .quiz-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .quiz-nav button {
            padding: 11px 22px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        #prevBtn {
            background: #f3f4f6;
            color: #4b5563;
        }

        #prevBtn:hover:not(:disabled) {
            background: #e5e7eb;
        }

        #prevBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #nextBtn, #submitBtn {
            background: #4f46e5;
            color: #fff;
        }

        #nextBtn:hover, #submitBtn:hover:not(:disabled) {
            background: #4338ca;
        }

        #submitBtn:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }

        /* =====================================================
           SCORE SCREEN
        ===================================================== */

        .score-big {
            text-align: center;
            font-size: 42px;
            font-weight: 800;
            color: #4f46e5;
            margin-bottom: 4px;
        }

        .score-sub {
            text-align: center;
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        .performance-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 26px;
        }

        .stat-box {
            text-align: center;
            padding: 14px 8px;
            border-radius: 12px;
            background: #f9fafb;
        }

        .stat-box .stat-value {
            font-size: 20px;
            font-weight: 800;
        }

        .stat-box.correct .stat-value { color: #059669; }
        .stat-box.incorrect .stat-value { color: #dc2626; }
        .stat-box.accuracy .stat-value { color: #4f46e5; }

        .stat-box .stat-label {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 600;
            margin-top: 4px;
        }

        .review-item {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .review-item.correct {
            border-color: #a7f3d0;
            background: #ecfdf5;
        }

        .review-item.incorrect {
            border-color: #fecaca;
            background: #fef2f2;
        }

        .review-question {
            font-weight: 700;
            font-size: 14px;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .review-answer-line {
            font-size: 13px;
            color: #4b5563;
        }

        .review-answer-line.wrong-answer {
            color: #b91c1c;
        }

        .review-answer-line.right-answer {
            color: #047857;
        }

        #retryBtn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #f3f4f6;
            color: #4338ca;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 16px;
        }

        #retryBtn:hover {
            background: #e5e7eb;
        }

        .empty-msg {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 640px) {
            #topbar { padding: 14px 16px; }
            #content { padding: 20px 16px 40px; }
            .card { padding: 20px; }
        }
    </style>
</head>

<body>

    <div id="topbar">
        <h1>🎯 Daily Quiz</h1>
        <button id="backButton" onclick="window.location.href='/Frontend/pages/dashboard.html'">
            ← Back to Dashboard
        </button>
    </div>

    <div id="content">

        <!-- ========== STAGE 1: SEMESTER PICKER ========== -->

        <div id="pickerStage">

            <h2 class="page-title" id="pickerTitle">DAILY QUIZ</h2>

            <div class="card">

                <p style="font-weight:700; font-size:14px; color:#1f2937; margin-bottom:12px;">
                    Choose a semester, or take questions from all semesters:
                </p>

                <div class="semester-grid" id="semesterGrid">
                    <div class="semester-option selected" data-semester="all">All Semesters</div>
                    <div class="semester-option" data-semester="1">Semester 1</div>
                    <div class="semester-option" data-semester="2">Semester 2</div>
                    <div class="semester-option" data-semester="3">Semester 3</div>
                    <div class="semester-option" data-semester="4">Semester 4</div>
                    <div class="semester-option" data-semester="5">Semester 5</div>
                    <div class="semester-option" data-semester="6">Semester 6</div>
                    <div class="semester-option" data-semester="7">Semester 7</div>
                    <div class="semester-option" data-semester="8">Semester 8</div>
                </div>

                <button id="startQuizBtn">Start Today's Quiz</button>

                <p id="pickerError" style="color:#dc2626; font-size:13px; text-align:center; margin-top:12px; display:none;"></p>

            </div>

        </div>


        <!-- ========== STAGE 2: QUIZ IN PROGRESS ========== -->

        <div id="quizStage" style="display:none;">

            <h2 class="page-title" id="quizDateTitle">DAILY QUIZ</h2>

            <div class="card">

                <div class="quiz-progress-label" id="progressLabel">Question 1/10</div>

                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width:10%;"></div>
                </div>

                <div class="quiz-question-text" id="quizQuestionText"></div>

                <div id="quizOptionsContainer"></div>

                <div class="quiz-nav">
                    <button id="prevBtn" disabled>← Previous</button>
                    <button id="nextBtn">Next →</button>
                    <button id="submitBtn" style="display:none;" disabled>Submit Quiz</button>
                </div>

            </div>

        </div>


        <!-- ========== STAGE 3: SCORE SCREEN ========== -->

        <div id="scoreStage" style="display:none;">

            <h2 class="page-title">Your Results</h2>

            <div class="card">

                <div class="score-big" id="scoreBig">0/10</div>
                <div class="score-sub">🎉 Quiz Complete!</div>

                <div class="performance-stats">
                    <div class="stat-box correct">
                        <div class="stat-value" id="statCorrect">0</div>
                        <div class="stat-label">CORRECT</div>
                    </div>
                    <div class="stat-box incorrect">
                        <div class="stat-value" id="statIncorrect">0</div>
                        <div class="stat-label">INCORRECT</div>
                    </div>
                    <div class="stat-box accuracy">
                        <div class="stat-value" id="statAccuracy">0%</div>
                        <div class="stat-label">ACCURACY</div>
                    </div>
                </div>

                <div id="reviewList"></div>

                <button id="retryBtn" onclick="window.location.reload()">Take Another Quiz Tomorrow</button>

            </div>

        </div>

    </div>

    <script>
        (function () {
            "use strict";

            const API_BASE_URL =
                (
                    window.location.hostname === "localhost" ||
                    window.location.hostname === "127.0.0.1"
                )
                    ? "http://localhost:5000"
                    : "https://college-notes-website-f64v.onrender.com";

            const token = localStorage.getItem("token");

            function authHeaders() {
                return {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                };
            }

            const pickerStage = document.getElementById("pickerStage");
            const quizStage = document.getElementById("quizStage");
            const scoreStage = document.getElementById("scoreStage");

            const semesterGrid = document.getElementById("semesterGrid");
            const startQuizBtn = document.getElementById("startQuizBtn");
            const pickerError = document.getElementById("pickerError");

            let selectedSemester = "all";
            let currentAttemptId = null;
            let questions = [];
            let currentIndex = 0;
            let userAnswers = {}; // question_id -> selected_option

            /* ================= SEMESTER PICKER ================= */

            semesterGrid.addEventListener("click", function (event) {

                const option = event.target.closest(".semester-option");
                if (!option) return;

                document.querySelectorAll(".semester-option").forEach(function (el) {
                    el.classList.remove("selected");
                });

                option.classList.add("selected");
                selectedSemester = option.dataset.semester;

            });

            startQuizBtn.addEventListener("click", async function () {

                pickerError.style.display = "none";
                startQuizBtn.disabled = true;
                startQuizBtn.textContent = "Loading...";

                try {

                    const res = await fetch(
                        API_BASE_URL + "/api/quiz/daily?semester=" + selectedSemester,
                        { headers: authHeaders() }
                    );

                    const data = await res.json();

                    if (!data.success) {
                        throw new Error(data.message || "Unable to load quiz.");
                    }

                    if (!data.questions || data.questions.length === 0) {
                        pickerError.textContent =
                            data.message || "No questions available for this selection yet.";
                        pickerError.style.display = "block";
                        startQuizBtn.disabled = false;
                        startQuizBtn.textContent = "Start Today's Quiz";
                        return;
                    }

                    currentAttemptId = data.attempt_id;
                    questions = data.questions;

                    console.log("DEBUG - loaded questions:", questions);

                    if (data.completed) {
                        showScoreScreen({
                            score: data.score,
                            correct_count: data.correct_count,
                            incorrect_count: data.incorrect_count,
                            total_questions: data.total_questions,
                            accuracy: Math.round((data.correct_count / data.total_questions) * 100)
                        }, data.questions);
                        return;
                    }

                    questions.forEach(function (q) {
                        if (q.selected_option) {
                            userAnswers[q.question_id] = q.selected_option;
                        }
                    });

                    currentIndex = 0;
                    showQuizStage();
                    renderQuestion();

                } catch (error) {

                    console.error("Start quiz error:", error);
                    pickerError.textContent = error.message || "Unable to connect to server.";
                    pickerError.style.display = "block";
                    startQuizBtn.disabled = false;
                    startQuizBtn.textContent = "Start Today's Quiz";

                }

            });

            /* ================= QUIZ STAGE ================= */

            function showQuizStage() {
                pickerStage.style.display = "none";
                quizStage.style.display = "block";
                scoreStage.style.display = "none";

                const dateTitle = document.getElementById("quizDateTitle");
                const today = new Date();
                dateTitle.textContent =
                    "DAILY QUIZ — " +
                    today.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
            }

            const progressLabel = document.getElementById("progressLabel");
            const progressFill = document.getElementById("progressFill");
            const quizQuestionText = document.getElementById("quizQuestionText");
            const quizOptionsContainer = document.getElementById("quizOptionsContainer");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const submitBtn = document.getElementById("submitBtn");

            function renderQuestion() {

                const q = questions[currentIndex];
                const total = questions.length;

                console.log("DEBUG - rendering question:", q, "| question_id:", q.question_id, "| typeof:", typeof q.question_id);

                progressLabel.textContent = "Question " + (currentIndex + 1) + "/" + total;
                progressFill.style.width = (((currentIndex + 1) / total) * 100) + "%";

                quizQuestionText.textContent = q.question;

                const options = [
                    { key: "A", text: q.option_a },
                    { key: "B", text: q.option_b },
                    { key: "C", text: q.option_c },
                    { key: "D", text: q.option_d }
                ];

                quizOptionsContainer.innerHTML = "";

                options.forEach(function (opt) {

                    const btn = document.createElement("button");
                    btn.className = "quiz-option";
                    btn.textContent = "🔘 " + opt.text;

                    if (userAnswers[q.question_id] === opt.key) {
                        btn.classList.add("selected");
                    }

                    btn.addEventListener("click", function () {

                        userAnswers[q.question_id] = opt.key;

                        console.log("DEBUG - answer selected. question_id:", q.question_id, "| option:", opt.key);
                        console.log("DEBUG - userAnswers now:", JSON.parse(JSON.stringify(userAnswers)));

                        document.querySelectorAll(".quiz-option").forEach(function (b) {
                            b.classList.remove("selected");
                        });

                        btn.classList.add("selected");

                        updateNavButtons();

                    });

                    quizOptionsContainer.appendChild(btn);

                });

                prevBtn.disabled = currentIndex === 0;

                if (currentIndex === total - 1) {
                    nextBtn.style.display = "none";
                    submitBtn.style.display = "inline-block";
                } else {
                    nextBtn.style.display = "inline-block";
                    submitBtn.style.display = "none";
                }

                updateNavButtons();

            }

            function updateNavButtons() {

                if (currentIndex === questions.length - 1) {

                    const allAnswered = allQuestionsAnswered();

                    console.log("DEBUG - checking submit button state");
                    console.log("DEBUG - userAnswers:", JSON.parse(JSON.stringify(userAnswers)));
                    console.log("DEBUG - question IDs expected:", questions.map(function (q) { return q.question_id; }));
                    console.log("DEBUG - allAnswered result:", allAnswered);

                    submitBtn.disabled = !allAnswered;

                }

            }

            function allQuestionsAnswered() {
                return questions.every(function (q) {
                    const answer = userAnswers[q.question_id];
                    const hasAnswer = !!answer;

                    if (!hasAnswer) {
                        console.log("DEBUG - MISSING answer for question_id:", q.question_id, "(type:", typeof q.question_id, ")");
                    }

                    return hasAnswer;
                });
            }

            prevBtn.addEventListener("click", function () {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion();
                }
            });

            nextBtn.addEventListener("click", function () {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                }
            });

            submitBtn.addEventListener("click", async function () {

                if (!allQuestionsAnswered()) {
                    alert("Please answer all questions before submitting.");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = "Submitting...";

                const answersPayload = questions.map(function (q) {
                    return {
                        question_id: q.question_id,
                        selected_option: userAnswers[q.question_id]
                    };
                });

                try {

                    const res = await fetch(
                        API_BASE_URL + "/api/quiz/daily/" + currentAttemptId + "/submit",
                        {
                            method: "POST",
                            headers: authHeaders(),
                            body: JSON.stringify({ answers: answersPayload })
                        }
                    );

                    const data = await res.json();

                    if (!data.success) {
                        throw new Error(data.message || "Unable to submit quiz.");
                    }

                    const resultRes = await fetch(
                        API_BASE_URL + "/api/quiz/daily/" + currentAttemptId + "/result",
                        { headers: authHeaders() }
                    );

                    const resultData = await resultRes.json();

                    showScoreScreen(data, resultData.success ? resultData.questions : questions);

                } catch (error) {

                    console.error("Submit quiz error:", error);
                    alert(error.message || "Unable to connect to server.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Quiz";

                }

            });

            /* ================= SCORE SCREEN ================= */

            function showScoreScreen(scoreData, reviewQuestions) {

                pickerStage.style.display = "none";
                quizStage.style.display = "none";
                scoreStage.style.display = "block";

                document.getElementById("scoreBig").textContent =
                    scoreData.score + "/" + scoreData.total_questions;

                document.getElementById("statCorrect").textContent = scoreData.correct_count;
                document.getElementById("statIncorrect").textContent = scoreData.incorrect_count;
                document.getElementById("statAccuracy").textContent = scoreData.accuracy + "%";

                const reviewList = document.getElementById("reviewList");
                reviewList.innerHTML = "";

                reviewQuestions.forEach(function (q, i) {

                    const isCorrect = q.selected_option === q.correct_option;

                    const item = document.createElement("div");
                    item.className = "review-item " + (isCorrect ? "correct" : "incorrect");

                    const optionsMap = {
                        A: q.option_a,
                        B: q.option_b,
                        C: q.option_c,
                        D: q.option_d
                    };

                    let html =
                        '<div class="review-question">Q' + (i + 1) + '. ' + q.question + '</div>';

                    html +=
                        '<div class="review-answer-line ' +
                        (isCorrect ? "right-answer" : "wrong-answer") +
                        '">Your answer: ' + (optionsMap[q.selected_option] || "Not answered") +
                        (isCorrect ? " ✅" : " ❌") + '</div>';

                    if (!isCorrect) {
                        html +=
                            '<div class="review-answer-line right-answer">Correct answer: ' +
                            optionsMap[q.correct_option] + '</div>';
                    }

                    item.innerHTML = html;

                    reviewList.appendChild(item);

                });

            }

        })();
    </script>

</body>
</html>
