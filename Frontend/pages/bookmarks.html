<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks | College Notes</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: #1a1a2e;
            min-height: 100vh;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #topbar {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(6px);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #topbar h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
        }

        #backButton, #logoutButton {
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        #backButton:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4338ca;
        }

        #content {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        #sectionTitle {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.18);
            margin-bottom: 20px;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 999px;
            border: none;
            background: rgba(255,255,255,0.85);
            color: #4338ca;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #4338ca;
            color: white;
        }

        .bookmark-card {
            background: white;
            padding: 18px 20px;
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .bookmark-card .type-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 8px;
        }

        .type-content { background: #e0e7ff; color: #4338ca; }
        .type-unit { background: #dbeafe; color: #1d4ed8; }
        .type-subject { background: #fef3c7; color: #92400e; }

        .bookmark-card h3 {
            margin: 4px 0 12px;
            font-size: 16px;
        }

        .bookmark-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .bookmark-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .open-btn {
            background: #2563eb;
            color: white;
        }

        .remove-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-msg {
            color: rgba(255,255,255,0.92);
            text-align: center;
            padding: 40px 0;
            font-size: 15px;
        }

        iframe.pdf-viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="topbar">
        <h1>🔖 My Bookmarks</h1>
        <div style="display:flex; gap:10px;">
            <button id="backButton">← Dashboard</button>
            <button id="logoutButton">Logout</button>
        </div>
    </div>

    <div id="content">

        <h2 id="sectionTitle">Your Saved Notes</h2>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="subject">Subject Notes</button>
            <button class="filter-btn" data-filter="unit">Unit Notes</button>
            <button class="filter-btn" data-filter="content">Topic Notes</button>
        </div>

        <div id="bookmarksContainer">
            <p class="empty-msg">Loading your bookmarks...</p>
        </div>

    </div>

    <script src="/Frontend/js/bookmarks.js"></script>
    <script src="../js/dark-mode.js"></script>
</body>
</html>
