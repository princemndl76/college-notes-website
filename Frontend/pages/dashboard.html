<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notes | Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }


/* ===== GLOBAL SEARCH BAR ===== */

#topbar {
    gap: 20px;
}

.brand-section {
    flex: 0 0 auto;
}

.search-wrapper {
    position: relative;
    flex: 1;
    max-width: 520px;
    min-width: 280px;
}

.search-box {
    width: 100%;
    height: 46px;
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 0 10px 0 14px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.search-box:focus-within {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
}

.search-icon {
    font-size: 18px;
    margin-right: 8px;
    flex-shrink: 0;
}

#globalSearch {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #1f2937;
    font-size: 14px;
}

#globalSearch::placeholder {
    color: #9ca3af;
}

#clearSearch {
    display: none;
    border: 0;
    background: transparent;
    color: #9ca3af;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
}

#clearSearch:hover {
    background: #f3f4f6;
    color: #ef4444;
    transform: none;
}

.search-hint {
    position: absolute;
    right: 12px;
    top: 52px;
    font-size: 11px;
    color: rgba(255,255,255,0.9);
    pointer-events: none;
}

.search-status {
    display: none;
    margin: 0 0 18px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.92);
    border-radius: 10px;
    color: #4b5563;
    font-size: 13px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.search-empty {
    display: none;
    grid-column: 1 / -1;
    text-align: center;
    background: rgba(255,255,255,0.94);
    color: #6b7280;
    padding: 28px 20px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.14);
}

@media (max-width: 800px) {
    #topbar {
        align-items: stretch;
        padding: 14px 16px;
        gap: 10px;
    }

    .brand-section {
        flex: 1;
    }

    .search-wrapper {
        order: 3;
        width: 100%;
        max-width: none;
        min-width: 0;
    }

    .search-hint {
        display: none;
    }

    #logoutButton {
        align-self: center;
    }
}

        @media (max-width: 640px) {

    #topbar {
        padding: 14px 16px;
        flex-wrap: wrap;
        gap: 8px;
    }

    #topbar h1 {
        font-size: 17px;
    }

    #content {
        padding: 20px 16px 40px;
    }

    #sectionTitle {
        font-size: 18px;
    }

    .browse-card,
    .subject-card {
        padding: 18px;
    }

    .bottom-actions {
        flex-direction: column;
    }

    .bottom-actions button {
        width: 100%;
    }

}

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: #1a1a2e;
            min-height: 100vh;

            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite, fadeIn 0.5s ease;

            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            background: rgba(255,255,255,0.12);
            animation: floaty 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape.s1 { width: 260px; height: 260px; top: -80px; left: -80px; }
        .bg-shape.s2 { width: 340px; height: 340px; bottom: -110px; right: -100px; animation-delay: 2s; }
        .bg-shape.s3 { width: 140px; height: 140px; top: 60%; left: 5%; animation-delay: 4s; }
        .bg-shape.s4 { width: 100px; height: 100px; top: 12%; right: 12%; animation-delay: 1s; }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-28px); }
        }

        /* ===== TOP BAR ===== */

        #topbar {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(6px);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #topbar h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #welcomeMessage {
            font-size: 14px;
            color: #6b7280;
            margin: 2px 0 0;
        }

        #logoutButton {
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        #logoutButton:hover {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        /* ===== CONTENT WRAPPER ===== */

        #content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 40px 60px;
            position: relative;
            z-index: 1;
        }

        /* ===== BREADCRUMB ===== */

        #breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: slideUp 0.4s ease;
        }

        #breadcrumb button {
            background: none;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 2px;
            transition: opacity 0.2s ease;
            text-shadow: 0 1px 6px rgba(0,0,0,0.2);
        }

        #breadcrumb button:hover {
            opacity: 0.75;
        }

        #breadcrumb button:disabled {
            color: #fff;
            opacity: 0.85;
            cursor: default;
        }

        #breadcrumb .sep {
            color: rgba(255,255,255,0.6);
        }

        #sectionTitle {
            margin: 0 0 20px;
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.18);
            animation: slideUp 0.4s ease 0.05s backwards;
        }

        /* ===== CARDS GRID ===== */

        #browseContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .browse-card,
        .subject-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
            border: 1px solid #f0f1f5;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            animation: slideUp 0.4s ease backwards;
        }

        .browse-card:nth-child(1) { animation-delay: 0.05s; }
        .browse-card:nth-child(2) { animation-delay: 0.1s; }
        .browse-card:nth-child(3) { animation-delay: 0.15s; }
        .browse-card:nth-child(4) { animation-delay: 0.2s; }
        .browse-card:nth-child(5) { animation-delay: 0.25s; }
        .browse-card:nth-child(6) { animation-delay: 0.3s; }

        .browse-card:hover,
        .subject-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
            border-color: #e0e7ff;
        }

        .browse-card h3,
        .subject-card h3 {
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 700;
        }

        .browse-card .meta {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .subject-code {
            font-weight: 700;
            color: #4f46e5;
        }

        .browse-card button,
        .subject-card button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .browse-card button:hover,
        .subject-card button:hover {
            background: #4338ca;
            transform: scale(1.03);
        }

        .empty-msg {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.15);
        }

        /* ===== BOTTOM ACTIONS ===== */

        .bottom-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .bottom-actions button {
            padding: 11px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            background: rgba(255,255,255,0.92);
            color: #4338ca;
            transition: all 0.2s ease;
        }

        .bottom-actions button:hover {
            background: #fff;
            transform: translateY(-2px);
        }

        #adminActions,
        #feedbackActions {
            display: none;
        }

        /* ===== LIVE USER COUNT ===== */

        #count {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #059669;
            background: rgba(236,253,245,0.95);
            border: 1px solid #d1fae5;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 18px;
            animation: slideUp 0.4s ease;
        }

        #count::before {
            content: "";
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
            70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }

    </style>
</head>

<body>

    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>

    <div id="topbar">
        <div class="brand-section">
            <h1>📚 College Notes</h1>
            <p id="welcomeMessage">Welcome!</p>
        </div>

        <div class="search-wrapper">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <input
                    type="search"
                    id="globalSearch"
                    placeholder="Search courses, years, semesters..."
                    aria-label="Search college notes"
                    autocomplete="off"
                    spellcheck="false"
                >
                <button
                    type="button"
                    id="clearSearch"
                    aria-label="Clear search"
                    title="Clear search"
                >✕</button>
            </div>
            <span class="search-hint">Press Ctrl + K to search</span>
        </div>

        <button id="logoutButton">Logout</button>
    </div>

    <div id="content">

        <div id="count">Loading…</div>

        <div id="searchStatus" class="search-status" aria-live="polite"></div>

        <!-- Breadcrumb: Course > Year > Semester -->
        <div id="breadcrumb"></div>

        <h2 id="sectionTitle">Choose Your Course</h2>

        <div id="browseContainer">
            <p class="empty-msg">Loading...</p>
            <div id="searchEmpty" class="search-empty">
                🔎 No matching results found.
                <br>
                <small>Try a different course, year, or semester name.</small>
            </div>
        </div>

        <div class="bottom-actions">

            <!-- Only shown to logged-in users with role = "admin" -->
            <span id="adminActions">
                <a href="/Frontend/pages/upload.html">
                    <button>Upload Note</button>
                </a>
                <a href="/Frontend/pages/admin.html">
                    <button>Admin Panel</button>
                </a>
            </span>

            <!-- Only shown to regular (non-admin) users -->
            <span id="feedbackActions">
                <a href="/Frontend/pages/feedback.html">
                    <button>Suggest Feedback</button>
                </a>
            </span>

        </div>

    </div>

    <!-- Live user count: safe-guarded so a missing/offline
         socket.io server never breaks the rest of the page -->
    <script>
        (function () {
            const countEl = document.getElementById("count");

            const script = document.createElement("script");
            script.src = "/socket.io/socket.io.js";

            script.onload = function () {
                try {
                    const socket = io();
                    socket.on("userCount", function (count) {
                        countEl.innerText = count + " users online";
                    });
                    socket.on("connect_error", function () {
                        countEl.style.display = "none";
                    });
                } catch (e) {
                    console.warn("Live user count unavailable:", e);
                    countEl.style.display = "none";
                }
            };

            script.onerror = function () {
                console.warn("socket.io.js failed to load — live count hidden.");
                countEl.style.display = "none";
            };

            document.head.appendChild(script);
        })();
    </script>

    <script src="/Frontend/js/dashboard.js"></script>

    <!-- ===== GLOBAL SEARCH ===== -->
    <script>
    (function () {
        "use strict";

        const searchInput = document.getElementById("globalSearch");
        const clearButton = document.getElementById("clearSearch");
        const container = document.getElementById("browseContainer");
        const status = document.getElementById("searchStatus");
        const empty = document.getElementById("searchEmpty");

        if (!searchInput || !clearButton || !container) return;

        let observerRunning = false;
        let lastQuery = "";

        function normalize(value) {
            return String(value || "")
                .toLowerCase()
                .normalize("NFKD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        function getSearchableItems() {
            return Array.from(container.children).filter(function (el) {
                return el.id !== "searchEmpty" &&
                       !el.classList.contains("empty-msg");
            });
        }

        function applySearch() {
            const query = normalize(searchInput.value);
            lastQuery = query;

            clearButton.style.display = query ? "block" : "none";

            const items = getSearchableItems();

            if (!query) {
                items.forEach(function (item) {
                    item.style.display = "";
                });
                status.style.display = "none";
                empty.style.display = "none";
                return;
            }

            let matches = 0;

            items.forEach(function (item) {
                const searchableText = normalize(item.textContent);
                const matched = searchableText.includes(query);

                item.style.display = matched ? "" : "none";

                if (matched) matches++;
            });

            status.textContent =
                matches === 0
                    ? "No results for “" + searchInput.value.trim() + "”"
                    : matches + (matches === 1 ? " result" : " results") +
                      " found for “" + searchInput.value.trim() + "”";

            status.style.display = "block";
            empty.style.display = matches === 0 ? "block" : "none";
        }

        searchInput.addEventListener("input", applySearch);

        clearButton.addEventListener("click", function () {
            searchInput.value = "";
            applySearch();
            searchInput.focus();
        });

        searchInput.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                searchInput.value = "";
                applySearch();
            }
        });

        document.addEventListener("keydown", function (event) {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
                event.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        });

        /*
         * dashboard.js dynamically replaces the cards when the user moves
         * Course → Year → Semester. Observe those changes and re-apply
         * the current search without modifying dashboard.js.
         */
        const observer = new MutationObserver(function () {
            if (observerRunning) return;
            observerRunning = true;

            requestAnimationFrame(function () {
                observerRunning = false;

                if (lastQuery) {
                    applySearch();
                }
            });
        });

        observer.observe(container, {
            childList: true,
            subtree: true
        });
    })();
    </script>

<script src="../js/dark-mode.js"></script>
<script src="../js/ask-ai.js"></script>
</body>
</html>
