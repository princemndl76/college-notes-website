<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notes | Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        @media (max-width: 640px) {

    #topbar {
        padding: 14px 16px;
        flex-wrap: wrap;
        gap: 8px;
    }

    #topbar h1 {
        font-size: 17px;
    }

    #content {
        padding: 20px 16px 40px;
    }

    #sectionTitle {
        font-size: 18px;
    }

    .browse-card,
    .subject-card {
        padding: 18px;
    }

    .bottom-actions {
        flex-direction: column;
    }

    .bottom-actions button {
        width: 100%;
    }

}

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: #1a1a2e;
            min-height: 100vh;

            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite, fadeIn 0.5s ease;

            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            background: rgba(255,255,255,0.12);
            animation: floaty 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape.s1 { width: 260px; height: 260px; top: -80px; left: -80px; }
        .bg-shape.s2 { width: 340px; height: 340px; bottom: -110px; right: -100px; animation-delay: 2s; }
        .bg-shape.s3 { width: 140px; height: 140px; top: 60%; left: 5%; animation-delay: 4s; }
        .bg-shape.s4 { width: 100px; height: 100px; top: 12%; right: 12%; animation-delay: 1s; }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-28px); }
        }

        /* ===== TOP BAR ===== */

        #topbar {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(6px);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #topbar h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #welcomeMessage {
            font-size: 14px;
            color: #6b7280;
            margin: 2px 0 0;
        }

        #logoutButton {
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        #logoutButton:hover {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        /* ===== CONTENT WRAPPER ===== */

        #content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 40px 60px;
            position: relative;
            z-index: 1;
        }

        /* ===== BREADCRUMB ===== */

        #breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: slideUp 0.4s ease;
        }

        #breadcrumb button {
            background: none;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 2px;
            transition: opacity 0.2s ease;
            text-shadow: 0 1px 6px rgba(0,0,0,0.2);
        }

        #breadcrumb button:hover {
            opacity: 0.75;
        }

        #breadcrumb button:disabled {
            color: #fff;
            opacity: 0.85;
            cursor: default;
        }

        #breadcrumb .sep {
            color: rgba(255,255,255,0.6);
        }

        #sectionTitle {
            margin: 0 0 20px;
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.18);
            animation: slideUp 0.4s ease 0.05s backwards;
        }

        /* ===== CARDS GRID ===== */

        #browseContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .browse-card,
        .subject-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
            border: 1px solid #f0f1f5;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            animation: slideUp 0.4s ease backwards;
        }

        .browse-card:nth-child(1) { animation-delay: 0.05s; }
        .browse-card:nth-child(2) { animation-delay: 0.1s; }
        .browse-card:nth-child(3) { animation-delay: 0.15s; }
        .browse-card:nth-child(4) { animation-delay: 0.2s; }
        .browse-card:nth-child(5) { animation-delay: 0.25s; }
        .browse-card:nth-child(6) { animation-delay: 0.3s; }

        .browse-card:hover,
        .subject-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
            border-color: #e0e7ff;
        }

        .browse-card h3,
        .subject-card h3 {
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 700;
        }

        .browse-card .meta {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .subject-code {
            font-weight: 700;
            color: #4f46e5;
        }

        .browse-card button,
        .subject-card button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .browse-card button:hover,
        .subject-card button:hover {
            background: #4338ca;
            transform: scale(1.03);
        }

        .empty-msg {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.15);
        }

        /* ===== BOTTOM ACTIONS ===== */

        .bottom-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .bottom-actions button {
            padding: 11px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            background: rgba(255,255,255,0.92);
            color: #4338ca;
            transition: all 0.2s ease;
        }

        .bottom-actions button:hover {
            background: #fff;
            transform: translateY(-2px);
        }

        #adminActions,
        #feedbackActions {
            display: none;
        }

        /* ===== LIVE USER COUNT ===== */

        #count {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #059669;
            background: rgba(236,253,245,0.95);
            border: 1px solid #d1fae5;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 18px;
            animation: slideUp 0.4s ease;
        }

        #count::before {
            content: "";
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
            70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }

    </style>
</head>

<body>

    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>

    <div id="topbar">
        <div>
            <h1>📚 College Notes</h1>
            <p id="welcomeMessage">Welcome!</p>
        </div>
        <button id="logoutButton">Logout</button>
    </div>

    <div id="content">

        <div id="count">Loading…</div>

        <!-- Breadcrumb: Course > Year > Semester -->
        <div id="breadcrumb"></div>

        <h2 id="sectionTitle">Choose Your Course</h2>

        <div id="browseContainer">
            <p class="empty-msg">Loading...</p>
        </div>

        <div class="bottom-actions">

            <!-- Only shown to logged-in users with role = "admin" -->
            <span id="adminActions">
                <a href="/Frontend/pages/upload.html">
                    <button>Upload Note</button>
                </a>
                <a href="/Frontend/pages/admin.html">
                    <button>Admin Panel</button>
                </a>
            </span>

            <!-- Only shown to regular (non-admin) users -->
            <span id="feedbackActions">
                <a href="/Frontend/pages/feedback.html">
                    <button>Suggest Feedback</button>
                </a>
            </span>

        </div>

    </div>

    <!-- Live user count: safe-guarded so a missing/offline
         socket.io server never breaks the rest of the page -->
    <script>
        (function () {
            const countEl = document.getElementById("count");

            const script = document.createElement("script");
            script.src = "/socket.io/socket.io.js";

            script.onload = function () {
                try {
                    const socket = io();
                    socket.on("userCount", function (count) {
                        countEl.innerText = count + " users online";
                    });
                    socket.on("connect_error", function () {
                        countEl.style.display = "none";
                    });
                } catch (e) {
                    console.warn("Live user count unavailable:", e);
                    countEl.style.display = "none";
                }
            };

            script.onerror = function () {
                console.warn("socket.io.js failed to load — live count hidden.");
                countEl.style.display = "none";
            };

            document.head.appendChild(script);
        })();
    </script>

    <script src="/Frontend/js/dashboard.js"></script>
<script src="../js/dark-mode.js"></script>
</body>
</html>
