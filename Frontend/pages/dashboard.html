<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Notes | Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        /* =====================================================
           BODY
        ===================================================== */

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: #1a1a2e;
            min-height: 100vh;

            background: linear-gradient(
                -45deg,
                #667eea,
                #764ba2,
                #f093fb,
                #4facfe
            );

            background-size: 400% 400%;

            animation:
                gradientShift 14s ease infinite,
                fadeIn 0.5s ease;

            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floaty {
            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-28px);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        /* =====================================================
           BACKGROUND SHAPES
        ===================================================== */

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            background: rgba(255, 255, 255, 0.12);
            animation: floaty 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape.s1 {
            width: 260px;
            height: 260px;
            top: -80px;
            left: -80px;
        }

        .bg-shape.s2 {
            width: 340px;
            height: 340px;
            bottom: -110px;
            right: -100px;
            animation-delay: 2s;
        }

        .bg-shape.s3 {
            width: 140px;
            height: 140px;
            top: 60%;
            left: 5%;
            animation-delay: 4s;
        }

        .bg-shape.s4 {
            width: 100px;
            height: 100px;
            top: 12%;
            right: 12%;
            animation-delay: 1s;
        }

        /* =====================================================
           TOP BAR
        ===================================================== */

        #topbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);

            position: sticky;
            top: 0;

            z-index: 100;
        }

        .brand-section {
            flex: 0 0 auto;
        }

        #topbar h1 {
            font-size: 20px;
            margin: 0;

            font-weight: 700;

            display: flex;
            align-items: center;

            gap: 8px;
        }

        #welcomeMessage {
            font-size: 14px;
            color: #6b7280;
            margin: 2px 0 0;
        }

        /* =====================================================
           SEARCH
        ===================================================== */

        .search-wrapper {
            position: relative;

            flex: 1;

            max-width: 520px;
            min-width: 280px;
        }

        .search-box {
            width: 100%;
            height: 46px;

            display: flex;
            align-items: center;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 14px;

            padding: 0 10px 0 14px;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-box:focus-within {
            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .search-icon {
            font-size: 18px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        #globalSearch {
            flex: 1;
            min-width: 0;

            border: 0;
            outline: 0;

            background: transparent;

            color: #1f2937;

            font-size: 14px;
        }

        #globalSearch::placeholder {
            color: #9ca3af;
        }

        #clearSearch {
            display: none;

            border: 0;
            background: transparent;

            color: #9ca3af;

            width: 30px;
            height: 30px;

            padding: 0;

            border-radius: 50%;

            cursor: pointer;

            font-size: 14px;

            flex-shrink: 0;
        }

        #clearSearch:hover {
            background: #f3f4f6;
            color: #ef4444;
        }

        .search-hint {
            position: absolute;

            right: 12px;
            top: 52px;

            font-size: 11px;

            color: rgba(255, 255, 255, 0.9);

            pointer-events: none;
        }

        /* =====================================================
           SEARCH RESULTS DROPDOWN
        ===================================================== */

        #searchResults {
            position: absolute;

            top: 54px;
            left: 0;
            right: 0;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.22);

            max-height: 450px;

            overflow-y: auto;

            display: none;

            z-index: 9999;
        }

        .search-result {
            padding: 14px 16px;

            border-bottom: 1px solid #eeeeee;

            cursor: pointer;

            transition: background 0.15s ease;
        }

        .search-result:last-child {
            border-bottom: none;
        }

        .search-result:hover {
            background: #f5f7ff;
        }

        .search-result-type {
            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            color: #4f46e5;

            margin-bottom: 4px;
        }

        .search-result-title {
            font-size: 15px;

            font-weight: 700;

            color: #1f2937;

            margin-bottom: 4px;
        }

        .search-result-description {
            font-size: 12px;

            color: #6b7280;

            line-height: 1.4;
        }

        .search-result-code {
            display: inline-block;

            margin-top: 6px;

            color: #4f46e5;

            font-size: 12px;

            font-weight: 700;
        }

        .search-message {
            padding: 18px;

            text-align: center;

            color: #6b7280;

            font-size: 13px;
        }

        /* =====================================================
           LOGOUT
        ===================================================== */

        #logoutButton {
            background: #fff;

            border: 1px solid #e5e7eb;

            color: #374151;

            padding: 9px 18px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;

            font-size: 13px;

            transition: all 0.2s ease;

            flex-shrink: 0;
        }

        #logoutButton:hover {
            background: #fef2f2;

            border-color: #fecaca;

            color: #dc2626;
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        #content {
            max-width: 1100px;

            margin: 0 auto;

            padding: 30px 40px 60px;

            position: relative;

            z-index: 1;
        }

        /* =====================================================
           LIVE USER COUNT
        ===================================================== */

        #count {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            font-size: 13px;

            font-weight: 600;

            color: #059669;

            background: rgba(236, 253, 245, 0.95);

            border: 1px solid #d1fae5;

            padding: 6px 12px;

            border-radius: 999px;

            margin-bottom: 18px;

            animation: slideUp 0.4s ease;
        }

        #count::before {
            content: "";

            width: 8px;
            height: 8px;

            background: #10b981;

            border-radius: 50%;

            display: inline-block;

            animation: pulse 1.6s infinite;
        }

        /* =====================================================
           SEARCH STATUS
        ===================================================== */

        #searchStatus {
            display: none;

            margin: 0 0 18px;

            padding: 10px 14px;

            background: rgba(255, 255, 255, 0.92);

            border-radius: 10px;

            color: #4b5563;

            font-size: 13px;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.10);
        }

        /* =====================================================
           BREADCRUMB
        ===================================================== */

        #breadcrumb {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 6px;

            margin-bottom: 20px;

            font-size: 14px;

            animation: slideUp 0.4s ease;
        }

        #breadcrumb button {
            background: none;

            border: none;

            color: #fff;

            font-weight: 600;

            font-size: 14px;

            cursor: pointer;

            padding: 4px 2px;

            transition: opacity 0.2s ease;

            text-shadow:
                0 1px 6px rgba(0, 0, 0, 0.2);
        }

        #breadcrumb button:hover {
            opacity: 0.75;
        }

        #breadcrumb button:disabled {
            color: #fff;

            opacity: 0.85;

            cursor: default;
        }

        #breadcrumb .sep {
            color: rgba(255, 255, 255, 0.6);
        }

        /* =====================================================
           SECTION TITLE
        ===================================================== */

        #sectionTitle {
            margin: 0 0 20px;

            font-size: 22px;

            font-weight: 700;

            color: white;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.18);

            animation:
                slideUp 0.4s ease 0.05s backwards;
        }

        /* =====================================================
           CARDS
        ===================================================== */

        #browseContainer {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 18px;

            margin-bottom: 30px;
        }

        .browse-card,
        .subject-card {
            background: white;

            padding: 24px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18);

            border: 1px solid #f0f1f5;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            cursor: pointer;

            animation:
                slideUp 0.4s ease backwards;
        }

        .browse-card:hover,
        .subject-card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 16px 36px rgba(0, 0, 0, 0.24);

            border-color: #e0e7ff;
        }

        .browse-card h3,
        .subject-card h3 {
            margin: 0 0 6px;

            font-size: 17px;

            font-weight: 700;
        }

        .browse-card .meta {
            color: #6b7280;

            font-size: 13px;

            margin-bottom: 16px;
        }

        .subject-code {
            font-weight: 700;

            color: #4f46e5;
        }

        .browse-card button,
        .subject-card button {
            padding: 10px 18px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            background: #4f46e5;

            color: white;

            font-weight: 600;

            font-size: 13px;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }

        .browse-card button:hover,
        .subject-card button:hover {
            background: #4338ca;

            transform: scale(1.03);
        }

        .empty-msg {
            color: rgba(255, 255, 255, 0.9);

            font-size: 14px;

            text-shadow:
                0 1px 6px rgba(0, 0, 0, 0.15);
        }

        /* =====================================================
           SEARCH EMPTY
        ===================================================== */

        #searchEmpty {
            display: none;

            grid-column: 1 / -1;

            text-align: center;

            background: rgba(255, 255, 255, 0.94);

            color: #6b7280;

            padding: 28px 20px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.14);
        }

        /* =====================================================
           BOTTOM ACTIONS
        ===================================================== */

        .bottom-actions {
            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 10px;
        }

        .bottom-actions button {
            padding: 11px 20px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;

            font-size: 13px;

            background: rgba(255, 255, 255, 0.92);

            color: #4338ca;

            transition: all 0.2s ease;
        }

        .bottom-actions button:hover {
            background: #fff;

            transform: translateY(-2px);
        }

        #adminActions,
        #feedbackActions {
            display: none;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            #topbar {
                align-items: stretch;

                padding: 14px 16px;

                gap: 10px;

                flex-wrap: wrap;
            }

            .brand-section {
                flex: 1;
            }

            .search-wrapper {
                order: 3;

                width: 100%;

                max-width: none;

                min-width: 0;
            }

            .search-hint {
                display: none;
            }

            #logoutButton {
                align-self: center;
            }
        }

        @media (max-width: 640px) {

            #topbar {
                padding: 14px 16px;

                flex-wrap: wrap;

                gap: 8px;
            }

            #topbar h1 {
                font-size: 17px;
            }

            #content {
                padding: 20px 16px 40px;
            }

            #sectionTitle {
                font-size: 18px;
            }

            .browse-card,
            .subject-card {
                padding: 18px;
            }

            .bottom-actions {
                flex-direction: column;
            }

            .bottom-actions button {
                width: 100%;
            }
        }
    </style>
</head>


<body>

    <!-- =====================================================
         BACKGROUND

    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>


    <!-- =====================================================

    <!-- =====================================================
         LIVE USER COUNT
    ===================================================== -->

    <script>

        (function () {

            const countEl =
                document.getElementById("count");

            const script =
                document.createElement("script");

            script.src =
                "/socket.io/socket.io.js";

            script.onload = function () {

                try {

                    const socket = io();

                    socket.on(
                        "userCount",
                        function (count) {

                            countEl.innerText =
                                count +
                                " users online";

                        }
                    );

                    socket.on(
                        "connect_error",
                        function () {

                            countEl.style.display =
                                "none";

                        }
                    );

                } catch (error) {

                    console.warn(
                        "Live user count unavailable:",
                        error
                    );

                    countEl.style.display =
                        "none";
                }
            };

            script.onerror = function () {

                console.warn(
                    "socket.io.js failed to load"
                );

                countEl.style.display =
                    "none";
            };

            document.head.appendChild(script);

        })();

    </script>


    <!-- =====================================================
         DASHBOARD JS
    ===================================================== -->

    <script src="/Frontend/js/dashboard.js"></script>


    <!-- =====================================================
         GLOBAL DATABASE SEARCH
    ===================================================== -->

    <script>

        (function () {

            "use strict";


            /* =================================================
               ELEMENTS
            ================================================= */

            const searchInput =
                document.getElementById("globalSearch");

            const clearButton =
                document.getElementById("clearSearch");

            const searchResults =
                document.getElementById("searchResults");

            const searchStatus =
                document.getElementById("searchStatus");

            const browseContainer =
                document.getElementById("browseContainer");


            if (
                !searchInput ||
                !clearButton ||
                !searchResults
            ) {
                console.error(
                    "Search elements not found."
                );

                return;
            }


            /* =================================================
               API
            ================================================= */

            const API_BASE_URL =
                (
                    window.location.hostname === "localhost" ||
                    window.location.hostname === "127.0.0.1"
                )
                    ? "http://localhost:5000"
                    : "https://college-notes-website-f64v.onrender.com";


            let searchTimer = null;


            /* =================================================
               NORMALIZE SEARCH
            ================================================= */

            function normalizeSearch(query) {

                query = query.trim();

                /*
                 * semester 4
                 * 4 semester
                 * 4th semester
                 */

                const semesterMatch =
                    query.match(
                        /^(?:semester\s*)?(\d+)(?:st|nd|rd|th)?\s*semester$/i
                    );

                if (semesterMatch) {

                    const number =
                        Number(semesterMatch[1]);

                    let suffix = "th";

                    if (number === 1) {
                        suffix = "st";
                    }

                    if (number === 2) {
                        suffix = "nd";
                    }

                    if (number === 3) {
                        suffix = "rd";
                    }

                    return (
                        number +
                        suffix +
                        " semester"
                    );
                }


                /*
                 * semester 4
                 */

                const simpleSemester =
                    query.match(
                        /^semester\s+(\d+)$/i
                    );

                if (simpleSemester) {

                    const number =
                        Number(simpleSemester[1]);

                    let suffix = "th";

                    if (number === 1) {
                        suffix = "st";
                    }

                    if (number === 2) {
                        suffix = "nd";
                    }

                    if (number === 3) {
                        suffix = "rd";
                    }

                    return (
                        number +
                        suffix +
                        " semester"
                    );
                }


                return query;
            }


            /* =================================================
               TYPE ICON
            ================================================= */

            function getIcon(type) {

                const icons = {

                    course: "📚",

                    year: "📅",

                    semester: "📖",

                    subject: "📘",

                    unit: "📑",

                    content: "📄",

                    note: "📝"

                };

                return icons[type] || "🔎";
            }


            /* =================================================
               TYPE NAME
            ================================================= */

            function getTypeName(type) {

                const names = {

                    course: "Course",

                    year: "Academic Year",

                    semester: "Semester",

                    subject: "Subject",

                    unit: "Unit",

                    content: "Topic",

                    note: "Note"

                };

                return names[type] || "Result";
            }


            /* =================================================
               CLEAR RESULTS
            ================================================= */

            function clearResults() {

                searchResults.innerHTML = "";

                searchResults.style.display =
                    "none";

                searchStatus.style.display =
                    "none";

            }


            /* =================================================
               RESTORE DASHBOARD
            ================================================= */

            function restoreDashboard() {

                clearResults();

                searchInput.value = "";

                clearButton.style.display =
                    "none";


                if (
                    typeof window.showCourses ===
                    "function"
                ) {

                    window.showCourses();

                }

            }


            /* =================================================
               CREATE RESULT
            ================================================= */

            function createResult(result) {

                const item =
                    document.createElement("div");

                item.className =
                    "search-result";


                const type =
                    document.createElement("div");

                type.className =
                    "search-result-type";

                type.textContent =
                    getIcon(result.type) +
                    " " +
                    getTypeName(result.type);


                const title =
                    document.createElement("div");

                title.className =
                    "search-result-title";

                title.textContent =
                    result.title ||
                    "Untitled";


                item.appendChild(type);

                item.appendChild(title);


                if (result.description) {

                    const description =
                        document.createElement("div");

                    description.className =
                        "search-result-description";

                    let text =
                        String(result.description);

                    if (text.length > 150) {

                        text =
                            text.substring(0, 150) +
                            "...";

                    }

                    description.textContent =
                        text;

                    item.appendChild(
                        description
                    );

                }


                if (result.code) {

                    const code =
                        document.createElement("span");

                    code.className =
                        "search-result-code";

                    code.textContent =
                        result.code;

                    item.appendChild(code);

                }


                item.addEventListener(
                    "click",
                    function () {

                        openResult(result);

                    }
                );


                return item;
            }


            /* =================================================
               OPEN RESULT
            ================================================= */

            function openResult(result) {

                /*
                 * COURSE
                 */

                if (
                    result.type === "course" &&
                    typeof window.showYears ===
                    "function"
                ) {

                    window.showYears({
                        id: result.id,
                        course_name: result.title,
                        name: result.title,
                        title: result.title
                    });

                    closeSearch();

                    return;
                }


                /*
                 * YEAR
                 */

                if (
                    result.type === "year" &&
                    typeof window.showSemesters ===
                    "function"
                ) {

                    window.showSemesters({
                        id: result.id,
                        year_name: result.title,
                        name: result.title,
                        title: result.title
                    });

                    closeSearch();

                    return;
                }


                /*
                 * SEMESTER
                 */

                if (
                    result.type === "semester" &&
                    typeof window.showSubjects ===
                    "function"
                ) {

                    window.showSubjects({
                        id: result.id,
                        semester_name: result.title,
                        name: result.title,
                        title: result.title
                    });

                    closeSearch();

                    return;
                }


                /*
                 * SUBJECT
                 */

                if (
                    result.type === "subject" &&
                    typeof window.openSubject ===
                    "function"
                ) {

                    window.openSubject(
                        result.id
                    );

                    closeSearch();

                    return;
                }


                /*
                 * UNIT / CONTENT / NOTE
                 *
                 * These can be connected to their
                 * exact pages later.
                 */

                if (
                    result.type === "unit" ||
                    result.type === "content" ||
                    result.type === "note"
                ) {

                    alert(
                        getTypeName(result.type) +
                        ":\n\n" +
                        (
                            result.title ||
                            "Untitled"
                        )
                    );

                }

            }


            /* =================================================
               CLOSE SEARCH
            ================================================= */

            function closeSearch() {

                searchInput.value = "";

                clearButton.style.display =
                    "none";

                searchResults.innerHTML = "";

                searchResults.style.display =
                    "none";

                searchStatus.style.display =
                    "none";

            }


            /* =================================================
               PERFORM SEARCH
            ================================================= */

            async function performSearch(query) {

                query =
                    query.trim();


                if (!query) {

                    restoreDashboard();

                    return;
                }


                searchResults.innerHTML =
                    '<div class="search-message">🔎 Searching...</div>';

                searchResults.style.display =
                    "block";


                searchStatus.textContent =
                    "Searching for \"" +
                    query +
                    "\"...";

                searchStatus.style.display =
                    "block";


                const normalizedQuery =
                    normalizeSearch(query);


                try {

                    const response =
                        await fetch(
                            API_BASE_URL +
                            "/api/search?q=" +
                            encodeURIComponent(
                                normalizedQuery
                            )
                        );


                    if (!response.ok) {

                        throw new Error(
                            "HTTP " +
                            response.status
                        );

                    }


                    const data =
                        await response.json();


                    console.log(
                        "Search response:",
                        data
                    );


                    if (
                        !data.success ||
                        !Array.isArray(
                            data.results
                        )
                    ) {

                        throw new Error(
                            "Invalid search response"
                        );

                    }


                    searchResults.innerHTML =
                        "";


                    if (
                        data.results.length === 0
                    ) {

                        searchResults.innerHTML =
                            '<div class="search-message">🔎 No results found for "' +
                            query +
                            '"</div>';

                        searchStatus.textContent =
                            "No results found for \"" +
                            query +
                            "\"";

                        searchStatus.style.display =
                            "block";

                        return;
                    }


                    /*
                     * Limit dropdown to first 15
                     * results.
                     */

                    const results =
                        data.results.slice(
                            0,
                            15
                        );


                    results.forEach(
                        function (result) {

                            searchResults.appendChild(
                                createResult(result)
                            );

                        }
                    );


                    searchResults.style.display =
                        "block";


                    searchStatus.textContent =
                        data.results.length +
                        (
                            data.results.length === 1
                                ? " result"
                                : " results"
                        ) +
                        " found";


                    searchStatus.style.display =
                        "block";

                } catch (error) {

                    console.error(
                        "Search error:",
                        error
                    );


                    searchResults.innerHTML =
                        '<div class="search-message">⚠️ Unable to search right now.<br>Please try again.</div>';


                    searchResults.style.display =
                        "block";


                    searchStatus.textContent =
                        "Search service unavailable.";

                    searchStatus.style.display =
                        "block";

                }

            }


            /* =================================================
               INPUT
            ================================================= */

            searchInput.addEventListener(
                "input",
                function () {

                    const query =
                        searchInput.value.trim();


                    clearButton.style.display =
                        query
                            ? "block"
                            : "none";


                    clearTimeout(
                        searchTimer
                    );


                    if (!query) {

                        restoreDashboard();

                        return;
                    }


                    searchTimer =
                        setTimeout(
                            function () {

                                performSearch(
                                    query
                                );

                            },
                            350
                        );

                }
            );


            /* =================================================
               CLEAR
            ================================================= */

            clearButton.addEventListener(
                "click",
                function () {

                    restoreDashboard();

                    searchInput.focus();

                }
            );


            /* =================================================
               ESC
            ================================================= */

            searchInput.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key ===
                        "Escape"
                    ) {

                        restoreDashboard();

                    }

                }
            );


            /* =================================================
               CTRL + K
            ================================================= */

            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        (
                            event.ctrlKey ||
                            event.metaKey
                        ) &&
                        event.key.toLowerCase() ===
                        "k"
                    ) {

                        event.preventDefault();

                        searchInput.focus();

                        searchInput.select();

                    }

                }
            );


            /* =================================================
               CLICK OUTSIDE
            ================================================= */

            document.addEventListener(
                "click",
                function (event) {

                    if (
                        !event.target.closest(
                            ".search-wrapper"
                        )
                    ) {

                        searchResults.style.display =
                            "none";

                    }

                }
            );

        })();

    </script>
