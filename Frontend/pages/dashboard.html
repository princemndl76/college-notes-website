<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notes | Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        /* ===== GLOBAL SEARCH BAR ===== */

        #topbar {
            gap: 20px;
        }

        .brand-section {
            flex: 0 0 auto;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 520px;
            min-width: 280px;
        }

        .search-box {
            width: 100%;
            height: 46px;
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 0 10px 0 14px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .search-icon {
            font-size: 18px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        #globalSearch {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #1f2937;
            font-size: 14px;
        }

        #globalSearch::placeholder {
            color: #9ca3af;
        }

        #clearSearch {
            display: none;
            border: 0;
            background: transparent;
            color: #9ca3af;
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        #clearSearch:hover {
            background: #f3f4f6;
            color: #ef4444;
            transform: none;
        }

        .search-hint {
            position: absolute;
            right: 12px;
            top: 52px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
        }

        .search-status {
            display: none;
            margin: 0 0 18px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            color: #4b5563;
            font-size: 13px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
        }

        /* ===== SEARCH RESULTS ===== */

        .global-search-result {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            border: 1px solid #f0f1f5;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: slideUp 0.3s ease backwards;
        }

        .global-search-result:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
            border-color: #e0e7ff;
        }

        .search-result-type {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #4f46e5;
            background: #eef2ff;
            padding: 5px 9px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .global-search-result h3 {
            margin: 0 0 7px;
            font-size: 17px;
            color: #1f2937;
        }

        .global-search-result p {
            margin: 0;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }

        .search-result-code {
            display: inline-block;
            margin-top: 10px;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 700;
        }

        .search-empty {
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            background: rgba(255, 255, 255, 0.94);
            color: #6b7280;
            padding: 28px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
        }

        /* ===== RESPONSIVE SEARCH ===== */

        @media (max-width: 800px) {

            #topbar {
                align-items: stretch;
                padding: 14px 16px;
                gap: 10px;
            }

            .brand-section {
                flex: 1;
            }

            .search-wrapper {
                order: 3;
                width: 100%;
                max-width: none;
                min-width: 0;
            }

            .search-hint {
                display: none;
            }

            #logoutButton {
                align-self: center;
            }
        }

        @media (max-width: 640px) {

            #topbar {
                padding: 14px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            #topbar h1 {
                font-size: 17px;
            }

            #content {
                padding: 20px 16px 40px;
            }

            #sectionTitle {
                font-size: 18px;
            }

            .browse-card,
            .subject-card,
            .global-search-result {
                padding: 18px;
            }

            .bottom-actions {
                flex-direction: column;
            }

            .bottom-actions button {
                width: 100%;
            }
        }

        /* ===== BODY ===== */

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: #1a1a2e;
            min-height: 100vh;
            background: linear-gradient(
                -45deg,
                #667eea,
                #764ba2,
                #f093fb,
                #4facfe
            );
            background-size: 400% 400%;
            animation:
                gradientShift 14s ease infinite,
                fadeIn 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            background: rgba(255, 255, 255, 0.12);
            animation: floaty 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape.s1 {
            width: 260px;
            height: 260px;
            top: -80px;
            left: -80px;
        }

        .bg-shape.s2 {
            width: 340px;
            height: 340px;
            bottom: -110px;
            right: -100px;
            animation-delay: 2s;
        }

        .bg-shape.s3 {
            width: 140px;
            height: 140px;
            top: 60%;
            left: 5%;
            animation-delay: 4s;
        }

        .bg-shape.s4 {
            width: 100px;
            height: 100px;
            top: 12%;
            right: 12%;
            animation-delay: 1s;
        }

        @keyframes floaty {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-28px);
            }
        }

        /* ===== TOP BAR ===== */

        #topbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #topbar h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #welcomeMessage {
            font-size: 14px;
            color: #6b7280;
            margin: 2px 0 0;
        }

        #logoutButton {
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        #logoutButton:hover {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        /* ===== CONTENT ===== */

        #content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 40px 60px;
            position: relative;
            z-index: 1;
        }

        /* ===== BREADCRUMB ===== */

        #breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: slideUp 0.4s ease;
        }

        #breadcrumb button {
            background: none;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 2px;
            transition: opacity 0.2s ease;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
        }

        #breadcrumb button:hover {
            opacity: 0.75;
        }

        #breadcrumb button:disabled {
            color: #fff;
            opacity: 0.85;
            cursor: default;
        }

        #breadcrumb .sep {
            color: rgba(255, 255, 255, 0.6);
        }

        #sectionTitle {
            margin: 0 0 20px;
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
            animation: slideUp 0.4s ease 0.05s backwards;
        }

        /* ===== CARDS ===== */

        #browseContainer {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(260px, 1fr)
            );
            gap: 18px;
            margin-bottom: 30px;
        }

        .browse-card,
        .subject-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            border: 1px solid #f0f1f5;
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
            cursor: pointer;
            animation: slideUp 0.4s ease backwards;
        }

        .browse-card:nth-child(1) {
            animation-delay: 0.05s;
        }

        .browse-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .browse-card:nth-child(3) {
            animation-delay: 0.15s;
        }

        .browse-card:nth-child(4) {
            animation-delay: 0.2s;
        }

        .browse-card:nth-child(5) {
            animation-delay: 0.25s;
        }

        .browse-card:nth-child(6) {
            animation-delay: 0.3s;
        }

        .browse-card:hover,
        .subject-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
            border-color: #e0e7ff;
        }

        .browse-card h3,
        .subject-card h3 {
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 700;
        }

        .browse-card .meta {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .subject-code {
            font-weight: 700;
            color: #4f46e5;
        }

        .browse-card button,
        .subject-card button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            font-size: 13px;
            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }

        .browse-card button:hover,
        .subject-card button:hover {
            background: #4338ca;
            transform: scale(1.03);
        }

        .empty-msg {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
        }

        /* ===== BOTTOM ACTIONS ===== */

        .bottom-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .bottom-actions button {
            padding: 11px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.92);
            color: #4338ca;
            transition: all 0.2s ease;
        }

        .bottom-actions button:hover {
            background: #fff;
            transform: translateY(-2px);
        }

        #adminActions,
        #feedbackActions {
            display: none;
        }

        /* ===== LIVE USER COUNT ===== */

        #count {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #059669;
            background: rgba(236, 253, 245, 0.95);
            border: 1px solid #d1fae5;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 18px;
            animation: slideUp 0.4s ease;
        }

        #count::before {
            content: "";
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {

            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>

<body>

    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>

    <!-- ===== TOP BAR ===== -->

    <div id="topbar">

        <div class="brand-section">

            <h1>📚 College Notes</h1>

            <p id="welcomeMessage">
                Welcome!
            </p>

        </div>

        <!-- ===== DATABASE SEARCH ===== -->

        <div class="search-wrapper">

            <div class="search-box">

                <span class="search-icon" aria-hidden="true">
                    🔍
                </span>

                <input
                    type="search"
                    id="globalSearch"
                    placeholder="Search courses, subjects, notes..."
                    aria-label="Search college notes"
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    type="button"
                    id="clearSearch"
                    aria-label="Clear search"
                    title="Clear search"
                >
                    ✕
                </button>

            </div>

            <span class="search-hint">
                Press Ctrl + K to search
            </span>

        </div>

        <button id="logoutButton">
            Logout
        </button>

    </div>

    <!-- ===== CONTENT ===== -->

    <div id="content">

        <div id="count">
            Loading…
        </div>

        <div
            id="searchStatus"
            class="search-status"
            aria-live="polite"
        ></div>

        <div id="breadcrumb"></div>

        <h2 id="sectionTitle">
            Choose Your Course
        </h2>

        <div id="browseContainer">

            <p class="empty-msg">
                Loading...
            </p>

            <div
                id="searchEmpty"
                class="search-empty"
            >
                🔎 No matching results found.
                <br>
                <small>
                    Try a different course, subject, unit, or note.
                </small>
            </div>

        </div>

        <!-- ===== BOTTOM ACTIONS ===== -->

        <div class="bottom-actions">

            <!-- Admin buttons -->

            <span id="adminActions">

                <a href="/Frontend/pages/upload.html">
                    <button>
                        Upload Note
                    </button>
                </a>

                <a href="/Frontend/pages/admin.html">
                    <button>
                        Admin Panel
                    </button>
                </a>

            </span>

            <!-- Feedback button -->

            <span id="feedbackActions">

                <a href="/Frontend/pages/feedback.html">
                    <button>
                        Suggest Feedback
                    </button>
                </a>

            </span>

        </div>

    </div>

    <!-- ===== LIVE USER COUNT ===== -->

    <script>
        (function () {

            const countEl =
                document.getElementById("count");

            const script =
                document.createElement("script");

            script.src =
                "/socket.io/socket.io.js";

            script.onload = function () {

                try {

                    const socket = io();

                    socket.on(
                        "userCount",
                        function (count) {

                            countEl.innerText =
                                count +
                                " users online";

                        }
                    );

                    socket.on(
                        "connect_error",
                        function () {

                            countEl.style.display =
                                "none";

                        }
                    );

                } catch (e) {

                    console.warn(
                        "Live user count unavailable:",
                        e
                    );

                    countEl.style.display =
                        "none";
                }

            };

            script.onerror = function () {

                console.warn(
                    "socket.io.js failed to load — live count hidden."
                );

                countEl.style.display =
                    "none";

            };

            document.head.appendChild(script);

        })();
    </script>

    <!-- ===== DASHBOARD JS ===== -->

    <script src="/Frontend/js/dashboard.js"></script>


    <!-- =====================================================
         DATABASE SEARCH
         ===================================================== -->

    <script>

        (function () {

            "use strict";

            const searchInput =
                document.getElementById("globalSearch");

            const clearButton =
                document.getElementById("clearSearch");

            const container =
                document.getElementById("browseContainer");

            const status =
                document.getElementById("searchStatus");

            const empty =
                document.getElementById("searchEmpty");


            if (
                !searchInput ||
                !clearButton ||
                !container
            ) {
                return;
            }


            /*
             * Detect whether website is running locally
             * or on Render.
             */

            const API_BASE =
                window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1"

                    ? "http://localhost:5000"

                    : "https://college-notes-website-f64v.onrender.com";


            let searchTimer = null;


            /* ===== CLEAR OLD SEARCH RESULTS ===== */

            function clearSearchResults() {

                container
                    .querySelectorAll(
                        ".global-search-result"
                    )
                    .forEach(function (element) {

                        element.remove();

                    });

            }


            /* ===== RESTORE DASHBOARD ===== */

            function restoreDashboard() {

                clearSearchResults();

                status.style.display = "none";

                empty.style.display = "none";

                /*
                 * Let dashboard.js show the normal
                 * Course → Year → Semester cards again.
                 */

                if (typeof showCourses === "function") {

                    showCourses();

                }

            }


            /* ===== RESULT ICON ===== */

            function getIcon(type) {

                const icons = {

                    course: "📚",

                    year: "📅",

                    semester: "📖",

                    subject: "📘",

                    unit: "📑",

                    content: "📄",

                    note: "📝"

                };

                return icons[type] || "🔎";

            }


            /* ===== RESULT TYPE ===== */

            function getTypeName(type) {

                const names = {

                    course: "Course",

                    year: "Academic Year",

                    semester: "Semester",

                    subject: "Subject",

                    unit: "Unit",

                    content: "Topic",

                    note: "Note"

                };

                return names[type] || "Result";

            }


            /* ===== CREATE RESULT CARD ===== */

            function createResultCard(result) {

                const card =
                    document.createElement("div");

                card.className =
                    "global-search-result";


                const type =
                    document.createElement("div");

                type.className =
                    "search-result-type";

                type.textContent =
                    getIcon(result.type) +
                    " " +
                    getTypeName(result.type);


                const title =
                    document.createElement("h3");

                title.textContent =
                    result.title || "Untitled";


                card.appendChild(type);

                card.appendChild(title);


                if (result.description) {

                    const description =
                        document.createElement("p");

                    let text =
                        String(result.description);

                    /*
                     * Keep very long note bodies
                     * from making huge cards.
                     */

                    if (text.length > 180) {

                        text =
                            text.substring(0, 180) +
                            "...";

                    }

                    description.textContent =
                        text;

                    card.appendChild(description);

                }


                if (result.code) {

                    const code =
                        document.createElement("span");

                    code.className =
                        "search-result-code";

                    code.textContent =
                        result.code;

                    card.appendChild(code);

                }


                card.addEventListener(
                    "click",
                    function () {

                        openSearchResult(result);

                    }
                );


                return card;

            }


            /* ===== OPEN SEARCH RESULT ===== */

            function openSearchResult(result) {

                /*
                 * Course
                 */

                if (
                    result.type === "course" &&
                    typeof showYears === "function"
                ) {

                    showYears(result.id);

                    searchInput.value = "";

                    clearButton.style.display =
                        "none";

                    status.style.display =
                        "none";

                    return;
                }


                /*
                 * Academic Year
                 */

                if (
                    result.type === "year" &&
                    typeof showSemesters === "function"
                ) {

                    showSemesters(result.id);

                    searchInput.value = "";

                    clearButton.style.display =
                        "none";

                    status.style.display =
                        "none";

                    return;
                }


                /*
                 * Semester
                 */

                if (
                    result.type === "semester" &&
                    typeof showSubjects === "function"
                ) {

                    showSubjects(result.id);

                    searchInput.value = "";

                    clearButton.style.display =
                        "none";

                    status.style.display =
                        "none";

                    return;
                }


                /*
                 * Subject
                 *
                 * Your dashboard.js already has
                 * openSubject().
                 */

                if (
                    result.type === "subject" &&
                    typeof openSubject === "function"
                ) {

                    openSubject(result.id);

                    searchInput.value = "";

                    clearButton.style.display =
                        "none";

                    status.style.display =
                        "none";

                    return;
                }


                /*
                 * For Unit / Content / Note:
                 *
                 * We don't guess your page URL.
                 * Show the information for now.
                 */

                if (
                    result.type === "unit" ||
                    result.type === "content" ||
                    result.type === "note"
                ) {

                    alert(
                        "Selected " +
                        getTypeName(result.type) +
                        ": " +
                        result.title
                    );

                }

            }


            /* ===== PERFORM DATABASE SEARCH ===== */

            async function performSearch(query) {

                clearSearchResults();

                empty.style.display =
                    "none";


                if (!query) {

                    restoreDashboard();

                    return;

                }


                status.textContent =
                    "Searching for \"" +
                    query +
                    "\"...";

                status.style.display =
                    "block";


                try {

                    const response =
                        await fetch(
                            API_BASE +
                            "/api/search?q=" +
                            encodeURIComponent(query)
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Search request failed"
                        );

                    }


                    const data =
                        await response.json();


                    if (
                        !data.success ||
                        !Array.isArray(data.results)
                    ) {

                        throw new Error(
                            "Invalid search response"
                        );

                    }


                    /*
                     * Hide normal dashboard cards.
                     */

                    Array.from(
                        container.children
                    ).forEach(function (element) {

                        if (
                            element.id !==
                            "searchEmpty" &&
                            !element.classList.contains(
                                "global-search-result"
                            )
                        ) {

                            element.style.display =
                                "none";

                        }

                    });


                    if (
                        data.results.length === 0
                    ) {

                        status.textContent =
                            "No results found for \"" +
                            query +
                            "\"";

                        empty.style.display =
                            "block";

                        return;

                    }


                    status.textContent =
                        data.results.length +
                        (
                            data.results.length === 1
                                ? " result"
                                : " results"
                        ) +
                        " found for \"" +
                        query +
                        "\"";


                    /*
                     * Show database results.
                     */

                    data.results.forEach(
                        function (result) {

                            const card =
                                createResultCard(
                                    result
                                );

                            container.appendChild(
                                card
                            );

                        }
                    );

                } catch (error) {

                    console.error(
                        "Search error:",
                        error
                    );

                    status.textContent =
                        "Unable to search right now. Please try again.";

                    status.style.display =
                        "block";

                    empty.style.display =
                        "none";

                }

            }


            /* ===== INPUT ===== */

            searchInput.addEventListener(
                "input",
                function () {

                    const query =
                        searchInput.value.trim();

                    clearButton.style.display =
                        query ? "block" : "none";


                    clearTimeout(
                        searchTimer
                    );


                    searchTimer =
                        setTimeout(
                            function () {

                                performSearch(
                                    query
                                );

                            },
                            350
                        );

                }
            );


            /* ===== CLEAR BUTTON ===== */

            clearButton.addEventListener(
                "click",
                function () {

                    searchInput.value =
                        "";

                    clearButton.style.display =
                        "none";

                    restoreDashboard();

                    searchInput.focus();

                }
            );


            /* ===== ESCAPE KEY ===== */

            searchInput.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Escape"
                    ) {

                        searchInput.value =
                            "";

                        clearButton.style.display =
                            "none";

                        restoreDashboard();

                    }

                }
            );


            /* ===== CTRL + K ===== */

            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        (event.ctrlKey ||
                            event.metaKey) &&
                        event.key.toLowerCase() === "k"
                    ) {

                        event.preventDefault();

                        searchInput.focus();

                        searchInput.select();

                    }

                }
            );

        })();

    </script>


    <!-- ===== DARK MODE ===== -->

    <script src="../js/dark-mode.js"></script>

    <!-- ===== ASK AI ===== -->

    <script src="../js/ask-ai.js"></script>
