<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>College Notes | Notes</title>


    <style>

        /* ==========================================
           GLOBAL
        ========================================== */

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 30px;

            color: #1a1a1a;

            min-height: 100vh;

            background:
                linear-gradient(
                    -45deg,
                    #667eea,
                    #764ba2,
                    #f093fb,
                    #4facfe
                );

            background-size: 400% 400%;

            animation:
                gradientShift 14s ease infinite;

            position: relative;

            overflow-x: hidden;

        }


        /* ==========================================
           BACKGROUND ANIMATION
        ========================================== */

        @keyframes gradientShift {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        .bg-shape {

            position: fixed;

            border-radius: 50%;

            filter: blur(2px);

            background:
                rgba(255, 255, 255, 0.12);

            animation:
                floaty 8s ease-in-out infinite;

            z-index: 0;

            pointer-events: none;

        }


        .bg-shape.s1 {

            width: 260px;
            height: 260px;

            top: -80px;
            left: -80px;

        }


        .bg-shape.s2 {

            width: 340px;
            height: 340px;

            bottom: -110px;
            right: -100px;

            animation-delay: 2s;

        }


        .bg-shape.s3 {

            width: 140px;
            height: 140px;

            top: 60%;
            left: 5%;

            animation-delay: 4s;

        }


        .bg-shape.s4 {

            width: 100px;
            height: 100px;

            top: 12%;
            right: 12%;

            animation-delay: 1s;

        }


        @keyframes floaty {

            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-28px);
            }

        }


        /* ==========================================
           MAIN CONTENT
        ========================================== */

        .header,
        #contentTitle,
        #progressContainer,
        #notesContainer {

            position: relative;

            z-index: 1;

        }


        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .header h1 {

            color: white;

            text-shadow:
                0 2px 10px
                rgba(0, 0, 0, 0.18);

        }


        /* ==========================================
           BACK BUTTON
        ========================================== */

        .back-button {

            padding: 10px 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background:
                rgba(255, 255, 255, 0.9);

            font-weight: bold;

            transition:
                transform 0.2s ease,
                background 0.2s ease;

        }


        .back-button:hover {

            background: #ffffff;

            transform:
                translateY(-2px);

        }


        /* ==========================================
           CONTENT TITLE
        ========================================== */

        #contentTitle {

            max-width: 800px;

            margin: 0 auto 20px;

            color: white;

            text-shadow:
                0 2px 10px
                rgba(0, 0, 0, 0.18);

        }


        /* ==========================================
           PROGRESS CONTAINER
        ========================================== */

        #progressContainer {

            max-width: 800px;

            margin:
                0 auto 20px;

        }


        .progress-panel {

            background: white;

            padding: 18px 20px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.18);

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

        }


        .progress-label {

            font-size: 17px;

            font-weight: bold;

            color: #222;

        }


        .progress-btn {

            border: none;

            padding: 11px 18px;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;

        }


        .progress-btn:hover {

            background: #1d4ed8;

            transform:
                translateY(-2px);

        }


        .progress-btn.completed {

            background: #16a34a;

        }


        .progress-btn.completed:hover {

            background: #15803d;

        }


        .progress-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }


        /* ==========================================
           NOTES CONTAINER
        ========================================== */

        #notesContainer {

            max-width: 800px;

            margin: 0 auto;

        }


        /* ==========================================
           NOTE CARD
        ========================================== */

        .note-card {

            background: white;

            padding: 25px 30px;

            border-radius: 15px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            animation:
                cardAppear 0.5s ease backwards;

        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .note-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 16px 36px
                rgba(0, 0, 0, 0.22);

        }


        .note-card h3 {

            margin-top: 0;

            margin-bottom: 15px;

        }


        /* ==========================================
           NOTE BODY
        ========================================== */

        .note-body {

            line-height: 1.7;

            color: #333;

            white-space: pre-wrap;

        }


        /* ==========================================
           NOTE ACTIONS
        ========================================== */

        .note-actions {

            margin-top: 20px;

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        /* ==========================================
           BOOKMARK BUTTON
        ========================================== */

        .bookmark-btn {

            border: none;

            padding: 10px 15px;

            border-radius: 8px;

            background: #f59e0b;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;

        }


        .bookmark-btn:hover {

            background: #d97706;

            transform:
                translateY(-2px);

        }


        .bookmark-btn.bookmarked {

            background: #16a34a;

        }


        .bookmark-btn.bookmarked:hover {

            background: #15803d;

        }


        .bookmark-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* ==========================================
           FILE BUTTON
        ========================================== */

        .note-file-btn {

            display: inline-block;

            padding: 10px 15px;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            font-weight: bold;

            transition:
                transform 0.2s ease,
                background 0.2s ease;

        }


        .note-file-btn:hover {

            background: #1d4ed8;

            transform:
                translateY(-2px);

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            body {

                padding: 15px;

            }


            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }


            .header h1 {

                margin-bottom: 0;

            }


            .progress-panel {

                flex-direction: column;

                align-items: stretch;

            }


            .progress-btn {

                width: 100%;

            }


            .note-card {

                padding: 20px;

            }


            .note-actions {

                flex-direction: column;

            }


            .bookmark-btn,
            .note-file-btn {

                width: 100%;

                text-align: center;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         BACKGROUND SHAPES
    =========================================== -->

    <div class="bg-shape s1"></div>

    <div class="bg-shape s2"></div>

    <div class="bg-shape s3"></div>

    <div class="bg-shape s4"></div>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <div class="header">

        <h1>
            📚 College Notes
        </h1>


        <button
            class="back-button"
            onclick="goBack()"
        >

            ← Back to Contents

        </button>

    </div>


    <!-- ==========================================
         CONTENT TITLE
    =========================================== -->

    <h2 id="contentTitle">

        Loading content...

    </h2>


    <!-- ==========================================
         PROGRESS
    =========================================== -->

    <div id="progressContainer">

        <!-- Progress button will be created by notes.js -->

    </div>


    <!-- ==========================================
         NOTES
    =========================================== -->

    <div id="notesContainer">

        <p>

            Loading notes...

        </p>

    </div>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="/Frontend/js/notes.js"></script>

    <script src="/Frontend/js/dark-mode.js"></script>


</body>

</html>
