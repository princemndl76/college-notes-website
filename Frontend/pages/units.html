<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>College Notes | Units</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            color: #1a1a1a;
            min-height: 100vh;

            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite;

            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            background: rgba(255,255,255,0.12);
            animation: floaty 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape.s1 { width: 260px; height: 260px; top: -80px; left: -80px; }
        .bg-shape.s2 { width: 340px; height: 340px; bottom: -110px; right: -100px; animation-delay: 2s; }
        .bg-shape.s3 { width: 140px; height: 140px; top: 60%; left: 5%; animation-delay: 4s; }
        .bg-shape.s4 { width: 100px; height: 100px; top: 12%; right: 12%; animation-delay: 1s; }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-28px); }
        }

        .header,
        #subjectTitle,
        p,
        #unitsContainer {
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        .back-button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.9);
            font-weight: bold;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .back-button:hover {
            background: #fff;
            transform: translateY(-2px);
        }

        #subjectTitle {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        body > p {
            color: rgba(255,255,255,0.9);
            margin-bottom: 25px;
        }

        #unitsContainer {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 20px;
        }

        .unit-card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18);

            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: cardAppear 0.5s ease backwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .unit-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
        }

        .unit-card h3 {
            margin-top: 0;
        }

        .unit-card button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>

    <div class="header">

        <h1>📚 College Notes</h1>

        <button
            class="back-button"
            onclick="goBack()"
        >
            ← Back
        </button>

    </div>


    <h2 id="subjectTitle">
        Loading subject...
    </h2>


    <p>
        Select a unit to continue learning.
    </p>


    <div id="unitsContainer">

        <p>
            Loading units...
        </p>

    </div>


    <script src="/Frontend/js/units.js"></script>
<script src="../js/dark-mode.js"></script>
</body>

</html>
