<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Notes | Leaderboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            color: #1a1a1a;
            min-height: 100vh;

            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite;

            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            background: rgba(255, 255, 255, 0.12);
            animation: floaty 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape.s1 { width: 260px; height: 260px; top: -80px; left: -80px; }
        .bg-shape.s2 { width: 340px; height: 340px; bottom: -110px; right: -100px; animation-delay: 2s; }
        .bg-shape.s3 { width: 140px; height: 140px; top: 60%; left: 5%; animation-delay: 4s; }
        .bg-shape.s4 { width: 100px; height: 100px; top: 12%; right: 12%; animation-delay: 1s; }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-28px); }
        }

        .header,
        #leaderboardContainer {
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .header h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
            margin: 0;
        }

        .back-button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            font-weight: bold;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .back-button:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }

        #leaderboardContainer {
            max-width: 800px;
            margin: 0 auto;
        }

        .leaderboard-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            overflow: hidden;
            animation: cardAppear 0.5s ease backwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .leaderboard-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            border-bottom: 1px solid #f0f1f5;
            transition: background 0.2s ease;
        }

        .leaderboard-row:last-child {
            border-bottom: none;
        }

        .leaderboard-row:hover {
            background: #f9fafb;
        }

        .rank {
            font-size: 20px;
            font-weight: bold;
            color: #6366f1;
            width: 40px;
            flex-shrink: 0;
            text-align: center;
        }

        .rank.gold { color: #f59e0b; }
        .rank.silver { color: #94a3b8; }
        .rank.bronze { color: #b45309; }

        .contributor-info {
            flex: 1;
            min-width: 0;
        }

        .contributor-name {
            font-weight: bold;
            font-size: 16px;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .contributor-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-badge {
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            background: #f3f4f6;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .empty-msg {
            background: white;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            color: #6b7280;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .leaderboard-row {
                padding: 14px 16px;
                flex-wrap: wrap;
            }

            .contributor-stats {
                width: 100%;
                margin-top: 4px;
            }

        }

    </style>

</head>


<body>


    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>


    <div class="header">

        <h1>🏆 Top Contributors</h1>

        <button class="back-button" onclick="window.location.href='dashboard.html'">
            ← Back to Dashboard
        </button>

    </div>


    <div id="leaderboardContainer">

        <p style="color:white; text-align:center;">Loading leaderboard...</p>

    </div>


    <script src="/Frontend/js/leaderboard.js"></script>
    <script src="/Frontend/js/dark-mode.js"></script>


</body>

</html>
