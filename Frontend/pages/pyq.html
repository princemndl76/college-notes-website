<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Year Questions | College Notes</title>

    <style>
        * { box-sizing: border-box; }

        @media (max-width: 640px) {
            #topbar { padding: 14px 16px; flex-wrap: wrap; gap: 8px; }
            #topbar h1 { font-size: 17px; }
            #content { padding: 20px 16px 40px; }
            #semesterTitle { font-size: 18px; }
            .paper-card { padding: 18px; }
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: #1a1a2e;
            min-height: 100vh;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite, fadeIn 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            background: rgba(255,255,255,0.12);
            animation: floaty 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape.s1 { width: 260px; height: 260px; top: -80px; left: -80px; }
        .bg-shape.s2 { width: 340px; height: 340px; bottom: -110px; right: -100px; animation-delay: 2s; }
        .bg-shape.s3 { width: 140px; height: 140px; top: 60%; left: 5%; animation-delay: 4s; }
        .bg-shape.s4 { width: 100px; height: 100px; top: 12%; right: 12%; animation-delay: 1s; }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-28px); }
        }

        /* ===== TOP BAR ===== */

        #topbar {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(6px);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #topbar h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-button {
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .back-button:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4338ca;
        }

        /* ===== CONTENT WRAPPER ===== */

        #content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 40px 60px;
            position: relative;
            z-index: 1;
        }

        #semesterTitle {
            margin: 0 0 20px;
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.18);
            animation: slideUp 0.4s ease 0.05s backwards;
        }

        /* ===== YEAR GRID ===== */

        #yearGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 14px;
            margin: 0 0 30px;
            animation: slideUp 0.4s ease backwards;
        }

        .year-btn {
            padding: 18px;
            border: 1px solid #f0f1f5;
            border-radius: 14px;
            background: white;
            font-weight: 700;
            font-size: 15px;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .year-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.2);
        }

        .year-btn.has-papers {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .year-btn.has-papers:hover {
            background: #4338ca;
        }

        /* ===== PAPER CARDS ===== */

        #papersContainer {
            display: grid;
            gap: 16px;
        }

        .paper-card {
            background: white;
            padding: 22px 24px;
            border-radius: 16px;
            border: 1px solid #f0f1f5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: slideUp 0.4s ease backwards;
        }

        .paper-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.24);
            border-color: #e0e7ff;
        }

        .paper-card h3 {
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 700;
        }

        .paper-card a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .paper-card a:hover {
            background: #4338ca;
            transform: scale(1.03);
        }

        .empty-msg {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>

    <div id="topbar">
        <h1>📝 Previous Year Questions</h1>
        <button class="back-button" onclick="window.history.back()">← Back</button>
    </div>

    <div id="content">
        <h2 id="semesterTitle">Loading...</h2>

        <div id="yearGrid"></div>

        <div id="papersContainer"></div>
    </div>

    <script src="/Frontend/js/pyq.js"></script>
</body>
</html>
